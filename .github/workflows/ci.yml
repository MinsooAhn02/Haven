name: CI

# 실행 횟수 줄이기 (11/11): 무료 비공개 레포는 Actions 시간이 월 한도라서.
# - push는 main만. 개인 브랜치는 PR을 열면 pull_request로 시험된다(조장의 6개 브랜치 동기화 push로 돌지 않게).
# - 문서·현황판만 바뀌면 건너뛴다(코드 시험과 무관).
# - 같은 브랜치에 새 커밋이 오면 앞의 실행은 취소한다.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'TASK_TODO.html', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'TASK_TODO.html', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sg-fixtures:
    name: SG fixture CLI tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run SG fixture CLI tests
        working-directory: 이민성/sg_audit
        run: |
          python -B - <<'PY'
          import test_network_audit
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromModule(test_network_audit)
          if suite.countTestCases() == 0:
              raise SystemExit("No SG fixture tests were discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  app-tests:
    name: Django app tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          # CI 임시 DB 전용 값. 실제 비밀값이 아니며 운영·개발 DB에 쓰지 않는다.
          # POSTGRES_USER는 컨테이너 superuser라 시험 DB(test_<DB_NAME>) 생성 권한이 있다.
          POSTGRES_USER: haven_owner
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: haven_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haven_owner -d haven_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DIR: 신요찬/app
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_NAME: haven_ci
      DB_USER: haven_owner
      DB_PASSWORD: ci-only-not-a-secret
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    defaults:
      run:
        # shell: bash를 명시해야 pipefail이 켜진다(기본 bash -e는 파이프 앞 명령 실패를 놓침).
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r 안민수/앱통합_초안/requirements.txt
      - name: Django checks
        working-directory: ${{ env.APP_DIR }}
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run app tests (0건이면 실패)
        working-directory: ${{ env.APP_DIR }}
        run: |
          python manage.py test --noinput -v 2 2>&1 | tee "$RUNNER_TEMP/test.log"
          bash "$GITHUB_WORKSPACE/안민수/앱통합_초안/require_tests_ran.sh" "$RUNNER_TEMP/test.log"
