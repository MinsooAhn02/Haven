name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sg-fixtures:
    name: SG fixture CLI tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run SG fixture CLI tests
        working-directory: 이민성/sg_audit
        run: |
          python -B - <<'PY'
          import test_network_audit
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromModule(test_network_audit)
          if suite.countTestCases() == 0:
              raise SystemExit("No SG fixture tests were discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
