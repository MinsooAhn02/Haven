main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}

a{color:var(--run)}

.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.role{color:var(--muted);font-size:12px;margin:2px 0 10px}

.s-ok{color:var(--ok);background:var(--ok-bg)}.s-run{color:var(--run);background:var(--run-bg)}
.s-wait{color:var(--wait);background:var(--wait-bg)}.s-block{color:var(--block);background:var(--block-bg)}.s-todo{color:var(--todo);background:var(--todo-bg)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
ul{margin:0;padding-left:0;list-style:none}
li{display:flex;gap:8px;padding:3px 0;font-size:14px}
li .m{flex:none;width:18px;text-align:center}
li.done{color:var(--muted);text-decoration:line-through}
.dep{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--wait-bg);color:var(--wait)}
.dep.none{background:var(--ok-bg);color:var(--ok)}
.links{margin-top:10px;font-size:13px}
.flow{display:grid;gap:8px}
.edge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.node{padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.node.hot{border-color:var(--block);color:var(--block);font-weight:600}
.arrow{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.err{background:var(--block-bg);color:var(--block);border:1px solid var(--block);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:600}
</style>
<script>
// 별도 script로 먼저 등록: 아래 DATA에 쉼표 누락 같은 문법 오류가 있으면 그 script는 통째로 실행되지 않아
// 화면이 빈 채로 남는다. 원인을 바로 알 수 있게 오류와 줄 번호를 페이지 맨 위에 띄운다.
window.addEventListener("error", e => {
  const box = document.getElementById("err");
  if (!box) return;
  box.hidden = false;
  box.textContent = `현황판 오류: ${e.message} (${e.lineno}줄) — 대부분 DATA의 쉼표·따옴표·괄호 문제입니다.`;
});
</script>
