<title>Haven 팀 현황판</title>
<!--
  왜 HTML인가: 공용 TODO.md는 기준 문서로 길어져서 "지금 누가 뭘 하고 누가 막혔는지"가 한눈에 안 보였다(2026-11-08 결정).
  갱신 방법: 매일 저녁 아래 DATA 객체만 고쳐 main PR로 올린다. 화면 코드는 건드리지 않는다.
  외부 라이브러리·폰트 없음 → git pull 후 파일을 브라우저로 바로 열면 된다.
-->
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e3e2dd;
--ok:#2f7d4f;--ok-bg:#e3f2e8;--run:#2457a6;--run-bg:#e2ebf8;--wait:#8a6a12;--wait-bg:#f8efd6;--block:#b3261e;--block-bg:#fbe3e1;--todo:#6b6b66;--todo-bg:#ecebe7}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--fg:#ecebe6;--muted:#a3a29b;--line:#34332f;
--ok:#7fcf9c;--ok-bg:#1d3326;--run:#8fb4ee;--run-bg:#1c2a40;--wait:#e3c46e;--wait-bg:#372e15;--block:#f2918a;--block-bg:#3d1d1a;--todo:#a3a29b;--todo-bg:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:32px 0 12px}
.sub{color:var(--muted);font-size:13px}
a{color:var(--run)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.dir{display:grid;gap:8px;margin-top:16px}
.dir div{display:flex;gap:10px}.dir b{min-width:52px}
.bar{height:10px;background:var(--todo-bg);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar span{display:block;height:100%;background:var(--ok)}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.round{padding:10px;border-radius:8px;background:var(--todo-bg);font-size:13px}
.round.now{background:var(--run-bg);outline:2px solid var(--run)}
.round b{display:block;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.role{color:var(--muted);font-size:12px;margin:2px 0 10px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-ok{color:var(--ok);background:var(--ok-bg)}.s-run{color:var(--run);background:var(--run-bg)}
.s-wait{color:var(--wait);background:var(--wait-bg)}.s-block{color:var(--block);background:var(--block-bg)}.s-todo{color:var(--todo);background:var(--todo-bg)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
ul{margin:0;padding-left:0;list-style:none}
li{display:flex;gap:8px;padding:3px 0;font-size:14px}
li .m{flex:none;width:18px;text-align:center}
li.done{color:var(--muted);text-decoration:line-through}
.dep{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--wait-bg);color:var(--wait)}
.dep.none{background:var(--ok-bg);color:var(--ok)}
.links{margin-top:10px;font-size:13px}
.flow{display:grid;gap:8px}
.edge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.node{padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.node.hot{border-color:var(--block);color:var(--block);font-weight:600}
.arrow{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:600px){.roadmap{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}}
.err{background:var(--block-bg);color:var(--block);border:1px solid var(--block);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:600}
</style>
<script>
// 별도 script로 먼저 등록: 아래 DATA에 쉼표 누락 같은 문법 오류가 있으면 그 script는 통째로 실행되지 않아
// 화면이 빈 채로 남는다. 원인을 바로 알 수 있게 오류와 줄 번호를 페이지 맨 위에 띄운다.
window.addEventListener("error", e => {
  const box = document.getElementById("err");
  if (!box) return;
  box.hidden = false;
  box.textContent = `현황판 오류: ${e.message} (${e.lineno}줄) — 대부분 DATA의 쉼표·따옴표·괄호 문제입니다.`;
});
</script>

인. 구민철 PC(Windows) 시험 60개 OK, 구민철 11:58 live 실행 PASS 11(권한 정리 확인용, 결과는 Git 제외). 보람 #118·#119: 27번에서 DescribeInstances·DescribeSubnets 제거, sts:GetCallerIdentity는 정책 없이 호출됨. 3회차 정식 점검은 11/23", done: true}, {t: "구민철 전달(조장이 직접, 증거 묶음은 #109로 완료): 구민철에게 boto3[crt] 설치와 live 실행 방법(network_audit.py live --baseline baseline.json --output-dir out/live-시각) 전달 ※ 새 실행 방법: --profile, VPC ID, baseline.live.json(SG ID 3개, Git 제외)이 필요함. 짝 리뷰는 구민철(자산 매핑·UNKNOWN 구분·3회차 실행)과 보람(권한 범위·가림 범위·sts:GetCallerIdentity 필요 여부)이 병합 뒤에 함 → 완료(11/16 09:2x, 조장 TODO 기록): 0.3.0 실행 방법(--profile·VPC ID·baseline.live.json, 증거는 구민철/sg_evidence) 전달, 구민철이 짝 리뷰와 0.3.1 확인까지 마침", done: true}, {t: "NET-06 · 06-b 통과 (민성 보고, PR #76 병합 완료 31edc43): 11/11 밤 night.sh → 11/12 아침 morning.sh 뒤 웹·DB 서비스 자동 복구, 내부·외부 healthz ok", done: true}, {t: "(11/12 이관) 첫 배포 다음: 6번 재부팅(NET-06) → 7번 백업·격리 복원 연습 (docs/인수인계/03_서버배포_인계.md 2장, db-1엔 backup.sh·restore.sh 붙여넣기) → 11/12: NET-06·06-b 통과(민성 보고). 7번 백업·격리 복원 연습은 11/13로 이관(db-1에 backup.sh·restore.sh·common.sh 반입, sha256 3개 일치 — 민성 보고) → 11/13 완료(민성 보고, #91 병합 8e84b07): 10:03 백업 20261113T010301Z → 격리 복원 DB 13 tables 줄 수 일치, 업로드 7개 sha256 일치. 운영 DB·업로드 폴더는 건드리지 않음, 사이트 중단 약 20분(시간도장 붙여 넣기 실수). 정식 복원은 4회차", done: true}, {t: "15번 SG 삭제 실제 시험: haven-sg-test 만 삭제되고 sg-web·sg-db·sg-alb 삭제는 거부되는지 (보람 #47) → 완료(11/13 11:38~11:42, 민성 CLI, 이후 #98 병합 0e1d63f): 운영 SG 3개와 default SG 삭제는 dry-run에서 UnauthorizedOperation 4건, 시험용 haven-sg-test는 생성 뒤 삭제 성공(허용 1·거부 4), 남은 시험용 리소스 없음. 보람 3회차 기록에도 같은 결과 반영", done: true}, {t: "ALB·WAF 밤 처리 결정: #57 비용 약 $4.55/주(밤·주말 유지 시). 유지 vs night.sh에서 삭제 → morning.sh 재생성(재생성하면 ALB DNS 이름이 바뀌어 Route 53 Alias·ACM 연결을 다시 맞춰야 함). 결정 뒤 destroy.sh에 ALB·리스너·대상 그룹·ACM·Route 53 정리 순서 추가 (실제 삭제는 조장 확인) → 11/12 현재: ALB는 밤에도 켜져 있음(night.sh·morning.sh에 ALB 처리 없음). 정식 결정은 아직 기록하지 않음. 혁민이 Web ACL을 만들었고(관리형 규칙 그룹 3개) 보람 비용 계산은 규칙 2개 가정이라 WAF 비용 재계산이 필요함 — 조장이 보람에게 문의 → 11/12 밤 보람 답변(#84 문서): 혁민 Web ACL(관리형 규칙 그룹 3개) 기본요금 약 월 $8(비용표 가정 $7에서 월 약 $1 증가), 야간·주말분 환산 약 $1.18, 보람은 야간 유지에 동의. 단가는 보람 계산이고 조장이 AWS 요금표와 대조하지 않음. 정식 결정은 아직 기록하지 않음 → 11/13 정리: 조장 운영 기록(#98) 기준 ALB·WAF는 밤·주말에도 유지(night.sh 21:00에 ALB 처리 없음, 주말 동안 유지해 WAF Count 로그를 쌓음). 혁민 Web ACL(관리형 규칙 그룹 3개) 기본요금은 보람 계산 월 약 8달러(요금표 대조는 하지 않음). destroy.sh의 ALB 정리 순서는 종료 시점에 정함", done: true}, {t: "web-1 IAM 역할 교체 (haven-ec2-ssm-role → haven-ec2-web-role, 보람 #84): 조장 검토에서 두 가지 발견 — ① 새 역할에 S3 권한이 없어 web-1의 backup-uploads.sh·restore-uploads.sh(s3://…/db-backups/)가 거부될 수 있음 ② 기록된 정책에는 새 역할에 대한 iam:PassRole과 인스턴스 프로파일 교체 권한이 없음(02번은 옛 역할만). 조장이 보람에게 두 가지 결정을 코멘트로 요청함. 역할 교체는 11/13 백업·격리 복원 연습 뒤가 안전하다는 것이 조장 검토 의견(결정은 아님). 교체 뒤에 시험 메일 EXT-03·04 → 완료(11/13 12:23 교체, 12:33까지 확인, #98 병합): web-1이 haven-ec2-web-role을 쓰고 비밀값 읽기·업로드 백업/복원(S3)·CloudWatch 로그·SSM Online·배포 2회가 정상. db-1은 공통 역할 유지(보람이 공통 역할의 웹 로그 정책 제거 후 db-1 재시험 OK, 민성 보고). 교체 정책 35번의 Resource * 범위는 보람 확인 사항으로 남음", done: true}, {t: "로그인 실패 제한 배포·AWS 시험 (#88 병합 593811a, 11/13): 배포 1회면 충분(deploy.sh 변경 없음, migration accounts/0001은 haven_owner가 자동 적용) → AWS 시험: 계정 축(5번 실패 뒤 6번째 429, 15분 뒤 회복), 분산 공격(서로 다른 IP의 팀원 3명 이상), IP 축(30번), 열거 응답 동일, 요청 로그. 분산 시험 직후 db-1에서 IP 키 수를 세는 확인은 조장이 함 (읽기 전용) → 11/16 운영 배포 370b22e(09:09~09:10, 배포 전 백업 뒤 2회, healthz 200) → 11/16 시험: 계정 축 통과 — 구민철 09:40~09:59 test3(400 × 5 → 6번째 429, 잠긴 동안 맞는 비밀번호도 429, 18분 뒤 로그인 성공, #114 병합 2fa9a70), 조장이 세 묶음(UTC 00:40·02:28·02:35) 모두 같은 결과 확인(앱 로그 login_failure → login_limited). 실제 접속 IP로 센다는 확인 통과 — DB accounts_loginfailure의 IP 키(해시)에서 구민철 10건은 같은 키, 다른 네트워크(휴대폰 LTE)는 다른 키(단일 사용자 두 네트워크 확인). → 11/18 2차 시험 통과(16:07~16:42, 요찬 PC·휴대폰 + 조장 web-1·db-1 읽기 전용 조회, 요찬 기록 #140 병합 2ca4d45): 없는 아이디도 400 ×5 뒤 429(열거 응답 동일), 가짜 X-Forwarded-For는 따로 세지 않음, DB IP 키가 요찬 PC·휴대폰의 실제 IP로 계산한 키와 일치(IP 키 n=8·2, 30번 뒤 n=30), 분산(PC 3 + 휴대폰 2)은 계정 n=5 뒤 모두 429, 30번 뒤 새 아이디·맞는 비밀번호는 429이고 다른 IP(휴대폰)는 같은 계정 로그인 성공. 시험하지 못한 것: 같은 순간에 몰린 동시 요청(알려진 허용 위험). 시험 IP는 WAF 로그(aws-waf-logs-haven)에 남아 있어 공유할 때 16:07~16:42 항목은 가림. 시험 계정 locktest_1116은 최종 정리까지 유지(조장 결정)", done: true}, {t: "시험 메일 EXT-03·04 기록 PR: 민성 보고로 11/13 14:25 EXT-03 도착(보람 확인, 실행 ID 일치)·14:28 EXT-04 실패 표시 통과. 기록 PR(#99)은 의도적으로 닫았고 나중에 다시 올린 뒤 알려 주기로 함. 그 전까지 main의 이민성 TODO에는 다음 주 이관으로 남아 있음 → 기록은 main에 채워짐: 요찬 4회차 검증 기록 #112 병합(1b6de3a, EXT-03·04 통과)과 이민성/TODO.md 11/13 오후 코멘트(실행 시각·run_id·판정). #99 재작성 여부는 조장 판단", done: true}, {t: "시험 메일 스팸함 도착 건 (구민철 #117, 11/16): 보낸 주소 도메인의 DKIM은 pass인데 메일이 스팸함으로 감. 원인 후보는 DMARC 레코드·SES 사용자 지정 MAIL FROM(조장 추정, 확인 안 됨) → 조장·보람이 의견을 모아 설정할지 정함. 시험용 SES sandbox라 급하지 않음"}, {t: "후속(조장): docs/인수인계/03 7번 아래 명령 BACKUP_BUCKET=haven-backup-${ACCOUNT_ID} bash backup.sh은 보람 #115의 계정 번호 변수화로 붙여 넣으면 빈 값이 됨 → 변수를 STS로 조회해 지정하는 방식으로 문구 정정. 계정 번호 가림 완료(11/17): 권혁민/waf의 원본 JSON 2개와 TODO 명령의 계정 번호를 혁민이 ${ACCOUNT_ID}로 가렸고 #130 병합(1dc05a9)으로 main에 반영됨. 이전 커밋의 Git 기록에는 번호가 남아 있으나 기록은 지우지 않음 → 11/18 인수인계 03 정정 완료(#143 병합 187090a): 백업 버킷을 STS로 조회해 지정, 백업 시각 바로 기록 안내, 인스턴스 ID·내부 IP 가림. 남음: EC2 web-1 인스턴스 ID가 김보람/AWS_자원현황_종료확인목록_2026-11-11.md, 김보람/1~4회차/3회차.md, 권혁민/tests/test_cloudwatch_app_prefix.py(같은 ID 값)에 남아 있어 한 번에 가릴지 조장이 정함"}, {t: "Nginx 접근 로그에 요청 식별자 기록 (조장 결정 11/13, 혁민 방안): web-setup.sh의 Nginx log_format에 X-Amzn-Trace-Id·X-Haven-Request-ID·응답 X-Request-ID를 기록(필요하면 X-Forwarded-For도 함께). X-Haven-Request-ID는 클라이언트 값이라 길이·형식을 제한해 로그 인젝션을 막음. PR 뒤 서버에서 web-setup.sh 재실행(site.conf 값 그대로, nginx -t), deploy.sh는 변경 없음. 16:46 조장 확정: 구현 민성·재검증 혁민(WAF → Nginx → 앱 로그가 같은 ID로 이어지는지)·기한 11/27. 재검증 때 /healthz는 앱 로그에서 빠지므로 /accounts/login/ 같은 경로로 확인 ※ 11/16 확인: 앱 로그와 nginx 접근 로그에는 실제 접속 IP가 없음(nginx는 ALB IP만 보임) → 이 작업에서 X-Forwarded-For도 함께 남기는 것을 검토 → 11/18 구현·적용: #143 병합 187090a(17:39, 혁민 리뷰 전 병합). 배포 전 백업 20261118T084244Z(17:42), 배포 187090a 2회 OK(17:43~44), web-setup.sh 재실행(17:45, nginx -t 통과), 요청 1건(17:46, X-Haven-Request-ID minsung-test-1)에서 Nginx trace·rid·cid·client와 앱 로그 request_id·trace_id·client_request_id가 같음(조장 보고, IP는 가림). 처음 두 번의 재실행은 배포 전이라 바뀐 것이 없었음. test-wsl.sh에 추가한 시험 11개는 WSL 환경이 없어 아직 실행하지 않음. 남음: 혁민 재검증(WAF 로그의 같은 trace), WSL 시험 실행"}, {t: "조장 일: PR 확인·병합 → 6개 브랜치 동기화 → 현황판·운영기록 → 공지      queue: [{t: "운영 경고 점검 (구현명세 DEP-05, 조장 11/16 15:08): web-1 SSM에서 manage.py check --deploy를 운영 370b22e로 실행해 경고 2건. security.W008(SECURE_SSL_REDIRECT)은 ALB 80 리스너가 HTTP를 443으로 301 전환하고 ALB→web-1은 HTTP라 예외(재검토: ALB 80 전환이 바뀔 때). security.W004(SECURE_HSTS_SECONDS)는 11/18 조치함: 요찬 #137(f0428d7, DJANGO_HTTPS=1일 때만 3600초, 하위 도메인·preload 끔)을 15:3x 배포 2회 → HTTPS 응답 Strict-Transport-Security max-age=3600, HTTP는 301 그대로, web-1 check --deploy 3건(W004 없음, W005·W008·W021은 앱계약 1.2.1에 적은 의도한 예외). 구민철 16:01 재확인(#141)과 일치. 기록은 #134·#142 병합. 11/19 결정: HSTS 기간은 과제 끝까지 1시간 유지(#154 병합). W008 예외는 앱계약 1.2.1에 이미 적혀 있어 앱 쪽 기록 추가는 필요 없음(요찬 답변)"}, {t: "RST-01 NAT 없을 때 (조장 업무 추가 11/19): 비용 계획대로 NAT를 지우는 밤에 확인. 21시 night.sh 대신 서버에 일회성 업데이트·S3 시도 예약 → nat-down.sh → SSM Offline·rt-private S3 경로 유지 확인 → ec2-stop.sh, 다음 날 아침 서버 기록으로 업데이트 실패·S3 성공 확인. 결과는 network/연결확인표.md E"}, {t: "CI-02 의존성 점검 (11/19, 조장): web-1 운영 venv(Python 3.12.3, 17개) pip freeze → PC pip-audit. 앱 실행 패키지 16개 취약점 0건, 설치 도구 pip 24.0만 6건 → pip는 앱 의존성이 아닌 설치 도구라 업그레이드 안 함(위험 수용, 운영기록 11/19). 결과는 구민철에게 전달(ASVS 매핑 증거)", done: true}, {t: "저장소 기록 정리 (11/19, 조장): 비공개 mirror 백업 뒤 git filter-repo로 계정 번호·인스턴스 ID·IP·호스팅 영역 ID·WAF ACL ID·인증서 ID를 기록에서 가리고 force push(팀 결정, 1회 예외). 팀 새 clone 공지, 민수 퍼블릭 전환. 운영 배포 187090a는 옛 기록의 이름이고 현재 기록에서는 #143 병합 577ef8b. 옛 PR 변경 화면에는 옛 값이 남을 수 있음. 11/19 오후 개인 이메일(본문 1건·커밋 작성자 이메일)을 같은 방식으로 한 번 더 지움(조장 실행). 운영 코드와 main 80a6f96의 차이는 노푸른 base.html 운영 관리자 메뉴(#159) 하나라 다음 배포 때 반영", done: true}, {t: "11/18 21시 night.sh 미실행: web-1·db-1과 NAT·공인 IP가 11/19 아침까지 약 11.5시간 더 켜져 있었음(추가 요금 약 $1~1.5 추정, 2026-11-18 운영기록 '운영 누락'). 남음: 11/27 업무 종료 뒤 12/02 발표까지 night.sh·morning.sh 운영, 영상 시연(12/01)에 쓸 환경 유지, 종료·삭제 시점은 조장이 정함. 조장 일정: 11/30 최종 결과물 통합, 12/01 최종 보고서 작성·영상 시연"}, {t: "매일 21시 night.sh · 09시 morning.sh"}],

    ["11/12 저녁 4", "#65 보람 로그 권한·폴더 정리 병합(98e1c8d), #66 푸른 오류 화면 기록·공유 설정 버튼 병합(82a7d82), #72 구민철 개인 회차·SG 인계서와 4회차 추가 업무 덧붙임 병합(c88e669). 병합 전 확인: #65는 링크 수정 24→2곳과 기록 보존 확인, #66은 요찬 승인과 앱 통합 시험 208 OK, #72는 충돌 해결과 400 확인 방식 정정. #76 이민성 로그 수집은 서버 재실행·짝 리뷰 대기. 동기화는 아직 안 함"],
    ["11/12 밤", "7개 브랜치 동기화 완료(Minsoo·Boram·Yochan·Pureun·Hyeokmin·Minchul은 main으로 당김, Minsung은 TODO 4개 충돌을 main 판으로 해결). 개인 TODO 최신화: 안민수·노푸른·혁민·보람·요찬은 PR #74, 이민성은 PR #76 브랜치. 구민철은 #72에서 최신. 병합은 승인 대기"],
    ["11/12 밤 2", "#76 이민성 로그 수집(OUT-10)·NET-06·06-b 기록·설치 스크립트 병합(31edc43): 보람 짝 리뷰와 최종 판 web-1 재실행(14:44, sha256 일치)·PC 가짜 시험 PASS 23 확인 뒤 병합. minsung-cw-logs 브랜치 삭제. 후속: Agent 설치 파일 서명·체크섬 검증, 로그 사용량 비용 확인, db-1 로그 수집 범위 결정, nginx X-Forwarded-For 기록"],
    ["11/12 밤 3", "#75 로그인 실패 제한 안 병합(c139f74): 조장 결정 = 15분 / 계정 5번 / IP 30번 / 영구 잠금 없음 / 400·429 / DB 저장. ALB XFF append 확인. 이제 요찬 구현·로컬 시험 → 혁민 점검 → 민성 병합·배포 → AWS 시험. 열린 것: 분산 시험 직후 db-1 IP 키 수 확인 담당 미정, AWS 시험에 서로 다른 IP의 팀원 3명 이상 필요, 혁민 CLI 묶음은 AWS에서 15분 안에 3번째 재실행부터 429"],
    ["11/12 밤 4", "오늘 병합: #78 서버 메일 설정(5bccce1), #77 IAM 기록(5162e58), #81 푸른 base.html·400 확인(2558889), #82 구민철 1회차(6c98b90), #79 첨부 검사 순서(88adb7e), #80 혁민 WAF Count 구성(ec91ee8), #83 민성 TODO(11647ab). 결정: 혁민 DeleteWebACL을 haven-* 범위로 승인, logs:PutResourcePolicy Resource * 승인, 로그인 실패 제한 15분·계정 5번·IP 30번(#75). 운영 배포는 6c98b90 기준이며 #79는 그 뒤 병합이라 미반영. ALB는 현재 밤에도 유지 중(정식 결정 미기록), WAF 비용은 규칙 3개 기준 재계산 문의 예정. 열린 것: 보람 새 커밋 5개 PR 전·권한 후속 확인 3개, 혁민 #80 후속 3개, 구민철 후속, 시험 메일 EXT-03·04(보람 ses:SendEmail 확인 뒤), IP 키 수 확인 담당 미정"],
    ["11/12 밤 5", "#84 보람 Web 전용 EC2 역할 기록 병합(8cb6dbd): 새 역할 haven-ec2-web-role(SES 발송·SSM 파라미터 읽기·CloudWatch 쓰기), web-1은 아직 옛 역할이라 메일 발송 불가. 조장 검토에서 새 역할에 첨부 백업·복원용 S3 권한이 없고 역할 교체용 PassRole·프로파일 교체 권한이 없음을 발견해 보람에게 코멘트로 요청. 보람 답변(#84 문서): WAF 기본요금 월 약 8달러(월 약 1달러 증가)·야간 유지 동의, ManageReferencedManagedRuleSets는 혁민 권한 오류 후 추가했고 필요성은 미검증. 열린 것: 역할 교체 시점(11/13 백업 연습 뒤 권장), ALB·WAF 밤 처리 정식 결정, 시험 메일 EXT-03·04는 교체 뒤, 3회차 문서의 낡은 #73 문장"],
    ["11/13", "#87 보람 AWS 실제 IAM 정책 대조 병합(69d17d5): 31~34번 원본 추가, 낡은 문장·링크 정정, #84 후속 답변. 조장 결정: 추가 크레딧 $20을 예비비에 합산해 예비 $40(운영 $100·합계 $140, 예산·경보 그대로). #88 요찬 로그인 실패 제한 구현은 혁민 점검 대기"],
    ["11/13 낮", "구민철 1회차 보고서 수정본 확인: 조장이 지적한 6가지(요약표 11번 문구, 공유 흐름 9개 표현, 검증 시각, 4장 표현, 그림 5 누락, 그림 주소창)가 모두 수정됐다고 조장이 확인. 조장이 일반 회원 계정으로 운영 화면을 돌아다녀 현재 사용자 표시(#81)와 세션·쿠키 비노출을 확인. 남은 것: 업로드 거부 직접 요청 시험, 공통 400(2회차), 운영 관리자 화면(4회차)"],

    ["11/13 오후", "#92 구민철 1회차 검증 보고서 병합(ceb9cad)와 #88 요찬 로그인 실패 제한 구현 병합(593811a). #88은 혁민 점검 코멘트(요구사항 충족, 인증 우회 취약점 없음, 동시 요청 초과는 허용 위험)와 조장 확인(점검 뒤 코드 변화 없음, SQLite 새 시험 17개 OK, GitGuardian은 시험용 가짜 비밀번호 오탐)을 거쳤고, 혁민은 로컬에서 XFF 가짜 값·429 문구·로그 비밀 노출까지 직접 시험했다고 구두 전달(코멘트에는 없음). 운영에는 아직 배포 전. 다음: 로그인 실패 제한 배포 1회와 AWS 시험(서로 다른 IP의 팀원 3명 이상), db-1 IP 키 수 확인 담당 미정, web-1 역할 교체(보람 #84), 시험 메일 EXT-03·04"],
    ["11/13 밤", "오후·저녁 병합 #94(보람 IAM 정책 대조·Web 역할 S3 PassRole·교체 정책, 새 계정 절차 초안), #95·#102(푸른 공유 흐름 대조·키보드 접근성), #96·#101(구민철 TODO·2회차 첨부 공유 보고서, 업로드 직접 요청 404), #97·#100(혁민 WAF Count 탐지·마스킹·연결 확인), #98·#103(조장 백업·재배포·WAF ALB 연결·web-1 역할 교체·SG 삭제 시험, SG 점검 도구 live 모드 PASS 11/FAIL 0). #99(시험 메일 EXT-03·04 기록)는 조장이 의도적으로 닫고 나중에 다시 올리기로 함(민성 보고로 통과). 결정: Nginx 접근 로그에 요청 식별자 기록 확정(16:46, 구현 민성·재검증 혁민·기한 11/27), 업로드 POST 직접 요청 시험은 조건부 허용했고 결과 404, ALB·WAF는 밤·주말 유지. 확인: WAF requestId와 앱 trace_id 일치(혁민 구두 15:43, 로그 원문 대조 미제출), 혁민 로그 조회 시험은 부분 완료로 정정. 열린 것: Nginx 로그 형식 PR, 로그인 실패 제한 배포·AWS 시험, 보람 다음 PR, 혁민 TODO 낡은 줄, 구민철 시험 데이터 정리, 시험 메일 기록 PR 재작성"],
    ["11/13 밤 2", "#105 구민철 공통 400 화면 보고서 병합(f79f15d): 파일 2개 동시 업로드로 공통 400 화면 확인(본인 글, 1회), 첨부·공유 보고서 항목 수 16으로 정정. 시험 당시 운영 배포는 a7bfcd6이고 다음 배포는 11/16(월) 조장이 할 예정(로그인 실패 제한 #88 포함) ※ 정정(11/16): 같은 날 17시에 808465d(#88 포함)를 배포해 #88은 11/13부터 운영에 있음. 열린 것: 구민철 시험 첨부 정리와 남은 시험(이름 규칙·암호화 PDF·다운로드 헤더), Nginx 로그 형식 PR, 보람 다음 PR"],

    ["11/16", "운영 배포 370b22e(09:09~09:10, 배포 전 백업 뒤 2회, healthz 200). 병합 #111~#123(보람 IAM·비용·계정 번호 가림·27번 권한 축소·혁민 20번 /haven/db 읽기·DB 로그 수집량, 요찬 4회차 검증 기록, 구민철 로그인 실패 제한·HTTPS 메일·첨부 추가 시험 보고, 푸른 TODO, 민성 SG 점검 0.3.1·db-1 로그 스크립트·TODO). 로그인 실패 제한: 계정 축(400 × 5 → 429, 회복)과 실제 접속 IP 키 확인 통과, 열거·분산·IP 30번은 11/17 2차. OUT-10 db-1 완료(/haven/db, 보존 30일, 설정 뒤 약 1시간에 +176줄·약 28 KB). SG 점검 0.3.1 실제 AWS PASS 11, 구민철 11:58 live PASS 11, 3회차 정식 점검은 11/23. WAF 연결 조회 성공(12:15). 시험 메일은 DKIM pass인데 스팸함 도착. 열린 것: 11/17 2차 시험, Nginx 요청 ID(11/27), 혁민 /haven/db 조회 재시험, 보람 비용 한 줄·변수 이름 통일, 구민철 경로 문자 시험 허용 판단(조장), 권혁민/waf 원본 JSON의 계정 번호 처리(조장), 인수인계 03 명령 문구"],

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// 정해진 5개 외 상태값(오타 등)이어도 페이지가 멈추지 않게 회색 "확인 필요"로 표시

$("legend").innerHTML = Object.keys(S).map(badge).join("");

  <h3><span>${p.no}. ${esc(p.name)}</span>${badge(p.status)}</h3>
  <div class="role">${esc(p.role)}</div>

  <div class="links"><a href="${GH}/blob/${p.id}/${encodeURI(p.folder)}/TODO.md">개인 TODO (${p.id} 브랜치)</a></div>
</div>`).join("");
