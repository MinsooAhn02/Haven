<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 시안 | Haven 기록</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7fb;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 40px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 42px rgb(23 32 51 / 8%);
    }

    .brand {
      margin: 0 0 28px;
      color: #2457c5;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.3;
    }

    .intro {
      margin: 10px 0 24px;
      color: #596579;
      font-size: 15px;
      line-height: 1.6;
    }

    .error-slot {
      min-height: 42px;
      margin-bottom: 20px;
      padding: 11px 13px;
      border: 1px dashed #c8d2e1;
      border-radius: 8px;
      color: #68758a;
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.45;
    }

    .auth-nav {
      display: flex;
      gap: 8px;
      margin: -12px 0 24px;
    }

    .auth-link {
      padding: 8px 11px;
      border-radius: 8px;
      color: #455166;
      font-size: 13px;
      text-decoration: none;
    }

    .auth-link[aria-current="page"] {
      color: #1948ad;
      background: #edf3ff;
      font-weight: 700;
    }

    .error-slot details { text-align: left; }
    .error-slot summary { cursor: pointer; font-weight: 700; }
    .error-list { margin: 8px 0 0; padding-left: 20px; }
    .error-list a { color: #8c3030; }
    .error-list li + li { margin-top: 5px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #172033;
      background: #fff;
      font: inherit;
      font-size: 15px;
    }

    input::placeholder { color: #8792a4; }

    input:focus-visible {
      border-color: #2457c5;
      outline: 3px solid rgb(36 87 197 / 20%);
      outline-offset: 1px;
    }

    .login-button {
      width: 100%;
      min-height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #2457c5;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover { background: #1948ad; }

    .login-button:focus-visible,
    .signup-link:focus-visible {
      outline: 3px solid #8db2ff;
      outline-offset: 3px;
    }

    .signup {
      margin: 24px 0 0;
      color: #596579;
      text-align: center;
      font-size: 14px;
    }

    .signup-link {
      margin-left: 5px;
      color: #2457c5;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .auth-link:focus-visible,
    .error-list a:focus-visible {
      outline: 3px solid #8db2ff;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-card" aria-labelledby="login-title">
    <p class="brand">Haven 기록</p>
    <nav class="auth-nav" aria-label="계정 메뉴">
      <a class="auth-link" href="로그인_디자인_시안.html" aria-current="page">로그인</a>
      <a class="auth-link" href="회원가입_디자인_시안.html">회원가입</a>
    </nav>
    <h1 id="login-title">로그인</h1>
    <p class="intro">내 기록을 보려면 로그인해 주세요.</p>

    <div class="error-slot">
      <details>
        <summary>입력 오류 안내 예시 보기</summary>
        <ul class="error-list">
          <li><a href="#username">아이디 항목: 아이디를 입력해 주세요.</a></li>
          <li><a href="#password">비밀번호 항목: 비밀번호를 입력해 주세요.</a></li>
        </ul>
      </details>
    </div>

    <form action="#" method="get">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" aria-describedby="username-error" placeholder="아이디를 입력하세요">
        <span id="username-error" hidden>아이디를 입력해 주세요.</span>
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" placeholder="비밀번호를 입력하세요">
        <span id="password-error" hidden>비밀번호를 입력해 주세요.</span>
      </div>

      <button class="login-button" type="button">로그인</button>
    </form>

    <p class="signup">
      처음 오셨나요?
      <a class="signup-link" href="회원가입_디자인_시안.html">회원가입</a>
    </p>
  </main>
</body>
</html>
