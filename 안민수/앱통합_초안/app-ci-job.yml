# 앱 CI job 초안 (2026-11-09, 안민수) — 11/09 밤 .github/workflows/ci.yml에 적용됨(APP_DIR=신요찬/app, 전체 앱 시험). 아래는 처음 초안 기록
#
# 왜 초안 상태인가: 앱 코드(신요찬/manage.py)가 main에 없을 때 넣으면 매 push가 실패하고,
# 반대로 "앱이 없으면 건너뛰기"를 넣으면 시험 0건이 성공으로 보인다(1회차 TODO 06의 금지 사항).
# 요찬 앱 PR이 main에 들어오는 PR에서 이 job을 ci.yml의 jobs: 아래에 그대로 붙인다.
#
# 근거: 신요찬/앱계약.md 1.2(환경변수) · 1.3(CREATEDB) · 1.4(명령). 앱 경로는 통합 때 확정되면 APP_DIR만 바꾼다.
# Python 3.12·3.13 둘 다 돌리는 이유: 서버 Python이 AMI 결정(11/09 회의) 전이라 두 버전 호환을 계속 확인한다.
# 결정되면 matrix에서 하나를 뺄지 다시 정한다.

  app-tests:
    name: Django app tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          # CI 임시 DB 전용 값. 실제 비밀값이 아니며 운영·개발 DB에 쓰지 않는다.
          # POSTGRES_USER는 컨테이너 superuser라 시험 DB(test_<DB_NAME>) 생성 권한이 있다.
          POSTGRES_USER: haven_owner
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: haven_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haven_owner -d haven_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DIR: 신요찬
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_NAME: haven_ci
      DB_USER: haven_owner
      DB_PASSWORD: ci-only-not-a-secret
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    defaults:
      run:
        # shell: bash를 명시해야 pipefail이 켜진다(기본 bash -e는 파이프 앞 명령 실패를 놓침).
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        working-directory: ${{ env.APP_DIR }}
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run app tests (0건이면 실패)
        working-directory: ${{ env.APP_DIR }}
        run: |
          python manage.py test accounts posts -v 2 2>&1 | tee "$RUNNER_TEMP/test.log"
          bash "$GITHUB_WORKSPACE/안민수/앱통합_초안/require_tests_ran.sh" "$RUNNER_TEMP/test.log"
