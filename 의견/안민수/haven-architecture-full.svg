<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1550" viewBox="0 0 2200 1550" role="img" aria-labelledby="title desc">
<title id="title">Haven 기본 프로젝트 전체 구성도</title>
<desc id="desc">Haven 기본 필수와 선택 범위에 맞춘 AWS 웹, DNS, 인증서, SES 이메일, IAM, SSM, WAF, 점검 도구와 증거 흐름도.</desc>
<defs>
 <marker id="arr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker>
 <marker id="blueArr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
 <marker id="orangeArr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ea580c"/></marker>
 <marker id="greenArr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#16a34a"/></marker>
 <style>
 text{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;fill:#182235}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#526176}.zone{fill:#f8fafc;stroke:#64748b;stroke-width:3}.subnet{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 6}.box{fill:#fff;stroke:#475569;stroke-width:2.5;rx:14}.aws{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5;rx:14}.security{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5;rx:14}.data{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5;rx:14}.note{fill:#fffbeb;stroke:#d97706;stroke-width:2;stroke-dasharray:7 5;rx:12}.head{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526176}.micro{font-size:13px;fill:#526176}.label{font-size:14px;font-weight:600;fill:#334155}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arr)}.admin{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#blueArr)}.policy{fill:none;stroke:#ea580c;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#orangeArr)}.dataflow{fill:none;stroke:#16a34a;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#greenArr)}.pill{fill:#e2e8f0;rx:10}.pilltxt{font-size:13px;font-weight:700;fill:#334155}
 </style>
</defs>
<rect width="2200" height="1550" fill="#fff"/>
<text x="55" y="58" class="title">Haven · 기본 프로젝트 전체 구성도</text>
<text x="55" y="91" class="sub">기본 필수 B1–B4 + 선택 C1–C4 · 팀 계획 기준 · 심화 암호화·실습 CA·mTLS·양자내성 확장은 제외</text>

<!-- External user and operator -->
<rect x="45" y="145" width="220" height="95" class="box"/><text x="155" y="183" text-anchor="middle" class="head">사용자 브라우저</text><text x="155" y="212" text-anchor="middle" class="body">도메인 HTTPS 접속</text>
<rect x="45" y="285" width="220" height="110" class="aws"/><text x="155" y="322" text-anchor="middle" class="head">Route 53</text><text x="155" y="350" text-anchor="middle" class="body">Public Hosted Zone</text><text x="155" y="375" text-anchor="middle" class="small">www → ALB 별칭</text>
<rect x="45" y="445" width="220" height="115" class="aws"/><text x="155" y="482" text-anchor="middle" class="head">ACM 공개 인증서</text><text x="155" y="510" text-anchor="middle" class="body">DNS 검증 · ALB 연결</text><text x="155" y="537" text-anchor="middle" class="small">HTTPS 443 · 80→443</text>
<rect x="45" y="655" width="220" height="130" class="box"/><text x="155" y="692" text-anchor="middle" class="head">관리자·개발자</text><text x="155" y="721" text-anchor="middle" class="body">AWS 콘솔 / CLI</text><text x="155" y="748" text-anchor="middle" class="small">MFA · IAM 사용자/그룹 정책</text><text x="155" y="770" text-anchor="middle" class="small">운영·감사 권한 분리</text>

<!-- Main AWS account -->
<rect x="315" y="130" width="1310" height="910" rx="24" class="zone"/>
<text x="350" y="174" class="head">AWS 계정 · 서울 리전 (계획값)</text>
<rect x="355" y="205" width="1225" height="790" rx="20" class="subnet"/>
<text x="385" y="244" class="head">VPC · Web / DB 비공개 배치</text>

<!-- Public subnet -->
<rect x="410" y="275" width="1110" height="160" rx="16" class="subnet"/>
<text x="438" y="310" class="head">공개 서브넷 · 서로 다른 가용 영역 2개</text>
<rect x="730" y="335" width="465" height="78" class="aws"/>
<text x="962" y="367" text-anchor="middle" class="head">Application Load Balancer</text>
<text x="962" y="394" text-anchor="middle" class="body">HTTPS 443 종료 · HTTP 80은 HTTPS로 리다이렉트</text>

<!-- Private web -->
<rect x="455" y="485" width="1000" height="185" rx="16" class="subnet"/>
<text x="482" y="522" class="head">비공개 Web 서브넷 · 공인 IP 없음</text>
<rect x="730" y="545" width="465" height="92" class="box"/>
<text x="962" y="579" text-anchor="middle" class="head">Web EC2 · Django</text>
<text x="962" y="608" text-anchor="middle" class="body">Nginx → Gunicorn → Django · 앱/서버 로그</text>
<rect x="1210" y="559" width="218" height="62" class="pill"/><text x="1319" y="584" text-anchor="middle" class="pilltxt">인스턴스 역할</text><text x="1319" y="605" text-anchor="middle" class="micro">SSM · 필요한 발송 권한만</text>

<!-- Private DB -->
<rect x="510" y="715" width="890" height="175" rx="16" class="subnet"/>
<text x="538" y="752" class="head">비공개 DB 서브넷 · 공인 IP 없음</text>
<rect x="730" y="775" width="465" height="82" class="data"/>
<text x="962" y="809" text-anchor="middle" class="head">DB EC2 · PostgreSQL</text>
<text x="962" y="836" text-anchor="middle" class="body">앱 전용 계정 · 최소 권한 · DB 로그</text>

<!-- VPC notes -->
<rect x="390" y="915" width="1140" height="58" class="note"/>
<text x="960" y="940" text-anchor="middle" class="label">미결정: 비공개 EC2의 패키지 설치·외부 API outbound (NAT 또는 필요한 VPC Endpoint)</text>
<text x="960" y="960" text-anchor="middle" class="small">SSM 관리 연결과 일반 인터넷 egress는 별도 경로입니다.</text>

<!-- Outside AWS services right -->
<rect x="1700" y="155" width="440" height="120" class="security"/><text x="1920" y="193" text-anchor="middle" class="head">AWS WAF · ALB에 연결</text><text x="1920" y="222" text-anchor="middle" class="body">관리 규칙 · Count 관찰 → Block · Rate 제한</text><text x="1920" y="250" text-anchor="middle" class="small">요청/정상 케이스 · 우회 접근 차단 확인</text>
<rect x="1700" y="315" width="440" height="105" class="aws"/><text x="1920" y="352" text-anchor="middle" class="head">CloudWatch Logs</text><text x="1920" y="381" text-anchor="middle" class="body">aws-waf-logs-haven · 보존/마스킹 확인</text><text x="1920" y="404" text-anchor="middle" class="small">WAF 요청 로그와 응답을 대조</text>
<rect x="1700" y="455" width="440" height="125" class="aws"/><text x="1920" y="492" text-anchor="middle" class="head">AWS Systems Manager</text><text x="1920" y="521" text-anchor="middle" class="body">Session Manager · SSH 인바운드 없이 관리</text><text x="1920" y="550" text-anchor="middle" class="small">IAM 정책 + 인스턴스 역할 + Agent 연결</text>
<rect x="1700" y="615" width="440" height="145" class="aws"/><text x="1920" y="652" text-anchor="middle" class="head">Amazon SES · 발신 전용</text><text x="1920" y="681" text-anchor="middle" class="body">Django → SES API · 테스트 메일 수신 확인</text><text x="1920" y="710" text-anchor="middle" class="small">Sandbox/리전/검증 주소 조건 확인</text><text x="1920" y="737" text-anchor="middle" class="small">메일 수신 서버·MX 레코드는 범위 밖</text>
<rect x="1700" y="795" width="440" height="115" class="data"/><text x="1920" y="833" text-anchor="middle" class="head">DB 백업·복원 시험</text><text x="1920" y="862" text-anchor="middle" class="body">백업 → 격리된 시험 DB 복원</text><text x="1920" y="888" text-anchor="middle" class="small">저장 대상·보존 방식은 계획에서 미확정</text>

<!-- DNS records detail -->
<rect x="45" y="825" width="590" height="215" rx="16" class="aws"/>
<text x="70" y="862" class="head">DNS 레코드 · 발신 메일 인증</text>
<text x="70" y="892" class="body">• A/ALIAS: www → ALB</text>
<text x="70" y="919" class="body">• ACM DNS 검증 CNAME</text>
<text x="70" y="946" class="body">• SES 도메인 확인 TXT + DKIM CNAME 3개</text>
<text x="70" y="973" class="body">• SPF TXT + DMARC TXT (발신 전용)</text>
<text x="70" y="1013" class="small">필요하면 도메인/레코드 값은 실제 환경에 맞춤</text>

<!-- IAM audit and tools below main -->
<rect x="665" y="1080" width="1475" height="250" rx="20" class="zone"/>
<text x="700" y="1120" class="head">점검 · 검증 · 개선 · 증거 (기본 C2–C4)</text>
<rect x="700" y="1150" width="270" height="112" class="box"/><text x="835" y="1184" text-anchor="middle" class="head">Prowler CLI</text><text x="835" y="1212" text-anchor="middle" class="small">AWS IAM / EC2 / 네트워크 점검</text><text x="835" y="1238" text-anchor="middle" class="small">별도 감사 권한 · 결과/오류 구분</text>
<rect x="990" y="1150" width="270" height="112" class="box"/><text x="1125" y="1184" text-anchor="middle" class="head">자체 boto3 점검</text><text x="1125" y="1212" text-anchor="middle" class="small">SG 위험 규칙 · IPv4/IPv6</text><text x="1125" y="1238" text-anchor="middle" class="small">JSON/CSV · 정상/위험/오류 시험</text>
<rect x="1280" y="1150" width="270" height="112" class="box"/><text x="1415" y="1184" text-anchor="middle" class="head">Lynis · pip-audit</text><text x="1415" y="1212" text-anchor="middle" class="small">EC2 OS / Python 의존성</text><text x="1415" y="1238" text-anchor="middle" class="small">발견 항목 조치 후 재검사</text>
<rect x="1570" y="1150" width="250" height="112" class="box"/><text x="1695" y="1184" text-anchor="middle" class="head">ZAP Baseline</text><text x="1695" y="1212" text-anchor="middle" class="small">사이트 탐색·수동 분석</text><text x="1695" y="1238" text-anchor="middle" class="small">범위/인증 상태 기록</text>
<rect x="1840" y="1150" width="270" height="112" class="security"/><text x="1975" y="1184" text-anchor="middle" class="head">요청 재현 스크립트</text><text x="1975" y="1212" text-anchor="middle" class="small">공격/정상 · WAF 로그 대조</text><text x="1975" y="1238" text-anchor="middle" class="small">동일 케이스로 개선 후 재시험</text>
<text x="700" y="1296" class="small">Lynis는 SSM 관리 경로로 서버 내부 실행 · ZAP/요청은 허가된 Haven ALB 도메인만 대상으로 수행</text>

<!-- Evidence/goal mapping -->
<rect x="45" y="1080" width="590" height="250" rx="20" class="data"/>
<text x="75" y="1120" class="head">산출물 · 목표 대응</text>
<text x="75" y="1155" class="body">B1 Web/DB · 동작/구성도</text><text x="355" y="1155" class="body">C1 DNS/HTTPS/메일</text>
<text x="75" y="1185" class="body">B2 IAM · 허용/거부</text><text x="355" y="1185" class="body">C2 최소 권한 개선</text>
<text x="75" y="1215" class="body">B3 네트워크 통제</text><text x="355" y="1215" class="body">C3 자동점검</text>
<text x="75" y="1245" class="body">B4 WAF/서버 정책</text><text x="355" y="1245" class="body">C4 개선/재시험</text>
<text x="75" y="1285" class="small">증거: 설정 · 응답 · 로그 · JSON/CSV · 전후 비교</text>
<text x="75" y="1310" class="small">위치: docs/evidence/ (민감정보·키는 제외)</text>

<!-- IAM, traffic and evidence arrows -->
<path d="M265 193 C430 193 550 333 718 366" class="flow"/><text x="430" y="243" class="label">HTTPS 443</text>
<path d="M265 338 C450 338 535 343 717 365" class="admin"/><text x="445" y="326" class="label">DNS 별칭</text>
<path d="M265 500 C455 500 535 400 730 380" class="admin"/><text x="457" y="454" class="label">인증서 연결</text>
<path d="M1195 374 L1700 215" class="policy"/><text x="1435" y="285" class="label">Web ACL 적용</text>
<path d="M1195 388 C1425 405 1510 370 1700 370" class="dataflow"/><text x="1445" y="397" class="label">WAF 로그</text>
<path d="M962 413 L962 535" class="flow"/><text x="980" y="478" class="label">HTTP 80 · ALB SG → Web SG</text>
<path d="M962 637 L962 765" class="flow"/><text x="980" y="712" class="label">TCP 5432 · Web SG → DB SG</text>
<path d="M1920 455 C1770 455 1650 574 1428 590" class="admin"/><path d="M1920 455 C1790 610 1670 810 1195 815" class="admin"/><text x="1550" y="485" class="label">세션 관리</text>
<path d="M1195 594 C1400 594 1530 674 1700 674" class="flow"/><text x="1450" y="625" class="label">SES SendEmail API</text>
<path d="M1195 820 C1420 850 1530 850 1700 850" class="dataflow"/>
<path d="M265 720 C420 720 535 940 650 1140" class="admin"/><text x="405" y="787" class="label">IAM 사용자/그룹 정책</text>
<path d="M265 748 C420 810 500 1160 690 1205" class="admin"/><text x="450" y="870" class="label">감사 권한·AWS API 조회</text>
<path d="M1060 970 C1060 1025 950 1050 900 1145" class="admin"/><text x="1070" y="1040" class="label">WAF/앱 로그·결과 대조</text>
<path d="M1550 975 C1550 1030 1730 1050 1880 1145" class="policy"/><text x="1580" y="1040" class="label">Count → Block · 재시험</text>

<!-- Legend and scope -->
<line x1="55" y1="1390" x2="110" y2="1390" class="flow"/><text x="125" y="1396" class="small">서비스 트래픽</text>
<line x1="290" y1="1390" x2="345" y2="1390" class="admin"/><text x="360" y="1396" class="small">관리/점검 흐름</text>
<line x1="555" y1="1390" x2="610" y2="1390" class="policy"/><text x="625" y="1396" class="small">보안 정책</text>
<line x1="770" y1="1390" x2="825" y2="1390" class="dataflow"/><text x="840" y="1396" class="small">로그/백업/증거</text>
<rect x="1100" y="1362" width="1010" height="70" class="note"/><text x="1125" y="1390" class="label">미결정: 실제 리전/예산·도메인·SES DNS 값·VPC egress·백업 저장 대상/보존기간</text><text x="1125" y="1415" class="small">이 구성도는 계획 표현이며, 자원 생성·정책 적용·성공 증거가 완료됐다는 뜻은 아닙니다.</text>
<text x="55" y="1495" class="small">심화 별도 범위: 애플리케이션 데이터 암호화/KMS · 실습 CA/mTLS · 고급 키 교체 · 양자내성 TLS 등</text>
</svg>
