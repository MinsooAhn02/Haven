<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Haven AWS 클라우드 보안 구성도</title><desc id="desc">공개 ALB와 WAF에서 비공개 Django 웹 서버와 PostgreSQL 데이터베이스로 이어지는 Haven 계획 구성도.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.subtitle{font-size:16px;fill:#536176}.zone{fill:#f8fafc;stroke:#64748b;stroke-width:3}.subnet{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 6}.box{fill:#fff;stroke:#475569;stroke-width:2.5;rx:14}.security{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5;rx:14}.cloud{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5;rx:14}.storage{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5;rx:14}.h1{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536176}.label{font-size:14px;font-weight:600;fill:#334155}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.adminflow{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowBlue)}.policy{fill:none;stroke:#ea580c;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}.note{fill:#fffbeb;stroke:#d97706;stroke-width:2;stroke-dasharray:6 4;rx:12}
  </style>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="60" y="62" class="title">Haven · AWS 클라우드 보안 구성도</text>
<text x="60" y="94" class="subtitle">계획안 · 공개 진입점은 ALB, 애플리케이션과 데이터베이스는 비공개 서브넷</text>
<!-- VPC -->
<rect x="285" y="155" width="1055" height="730" rx="24" class="zone"/>
<text x="315" y="195" class="h1">AWS VPC</text><text x="440" y="195" class="small">Web·DB 인바운드는 보안 그룹 참조로 제한</text>
<!-- public -->
<rect x="325" y="225" width="975" height="165" rx="18" class="subnet"/>
<text x="350" y="258" class="h1">공개 서브넷 · 서로 다른 AZ 2개</text>
<rect x="615" y="280" width="400" height="82" class="cloud"/>
<text x="815" y="313" text-anchor="middle" class="h1">Application Load Balancer</text>
<text x="815" y="340" text-anchor="middle" class="body">HTTPS 443 종료 · HTTP는 HTTPS로 리다이렉트</text>
<!-- private web -->
<rect x="380" y="455" width="865" height="175" rx="18" class="subnet"/>
<text x="405" y="488" class="h1">비공개 Web 서브넷</text>
<rect x="615" y="510" width="400" height="90" class="box"/>
<text x="815" y="543" text-anchor="middle" class="h1">Web EC2</text>
<text x="815" y="572" text-anchor="middle" class="body">Nginx · Gunicorn · Django</text>
<!-- private db -->
<rect x="450" y="695" width="725" height="145" rx="18" class="subnet"/>
<text x="475" y="728" class="h1">비공개 DB 서브넷</text>
<rect x="615" y="750" width="400" height="70" class="box"/>
<text x="815" y="779" text-anchor="middle" class="h1">DB EC2 · PostgreSQL</text>
<text x="815" y="804" text-anchor="middle" class="small">TCP 5432 · Web 보안 그룹에서만</text>
<!-- outside components -->
<rect x="45" y="285" width="190" height="88" class="box"/><text x="140" y="320" text-anchor="middle" class="h1">사용자</text><text x="140" y="347" text-anchor="middle" class="body">브라우저 HTTPS</text>
<rect x="45" y="430" width="190" height="88" class="cloud"/><text x="140" y="465" text-anchor="middle" class="h1">Route 53</text><text x="140" y="492" text-anchor="middle" class="body">도메인 → ALB</text>
<rect x="1390" y="230" width="170" height="88" class="security"/><text x="1475" y="266" text-anchor="middle" class="h1">AWS WAF</text><text x="1475" y="293" text-anchor="middle" class="body">Web ACL</text>
<rect x="1390" y="470" width="170" height="88" class="cloud"/><text x="1475" y="506" text-anchor="middle" class="h1">SSM</text><text x="1475" y="533" text-anchor="middle" class="body">관리 세션</text>
<rect x="1390" y="600" width="170" height="88" class="cloud"/><text x="1475" y="636" text-anchor="middle" class="h1">Amazon SES</text><text x="1475" y="663" text-anchor="middle" class="body">메일 발송 API</text>
<rect x="1390" y="745" width="170" height="88" class="storage"/><text x="1475" y="781" text-anchor="middle" class="h1">S3</text><text x="1475" y="808" text-anchor="middle" class="body">DB 백업</text>
<rect x="1390" y="350" width="170" height="88" class="cloud"/><text x="1475" y="386" text-anchor="middle" class="h1">CloudWatch</text><text x="1475" y="413" text-anchor="middle" class="body">WAF 로그</text>
<!-- flows -->
<path d="M235 327 C390 327 455 327 605 327" class="flow"/><text x="390" y="312" class="label">HTTPS 443</text>
<path d="M235 473 C390 473 430 360 610 350" class="adminflow"/><text x="355" y="438" class="label">DNS 별칭</text>
<path d="M815 362 L815 500" class="flow"/><text x="830" y="435" class="label">HTTP 80 · ALB SG만 허용</text>
<path d="M815 600 L815 742" class="flow"/><text x="830" y="680" class="label">TCP 5432 · Web SG만 허용</text>
<path d="M1390 274 C1280 274 1190 290 1025 310" class="policy"/><text x="1140" y="267" class="label">정책 적용</text>
<path d="M1390 515 C1280 515 1195 510 1018 530" class="adminflow"/><path d="M1390 535 C1300 570 1240 690 1015 772" class="adminflow"/><text x="1205" y="410" class="label">세션 시작</text>
<path d="M1015 555 C1170 570 1260 625 1380 640" class="flow"/><text x="1160" y="545" class="label">발송 요청</text>
<path d="M1475 318 L1475 344" class="flow"/>
<path d="M1015 785 C1170 800 1260 790 1380 790" class="adminflow"/><text x="1165" y="775" class="label">백업 · 방식 확정 필요</text>
<!-- outbound decision -->
<rect x="385" y="900" width="855" height="62" class="note"/>
<text x="812" y="927" text-anchor="middle" class="label">결정 필요: 비공개 EC2의 패키지 다운로드·외부 API outbound 경로 (NAT 또는 필요한 VPC Endpoint)</text>
<text x="812" y="949" text-anchor="middle" class="small">SSM은 관리 경로이며, 인터넷 패키지 저장소 접근을 자동 제공하지 않습니다.</text>
<text x="60" y="975" class="small">실선: 서비스 통신 · 점선: DNS / 보안 정책 / 관리 / 로그 / 백업 경로</text>
</svg>



